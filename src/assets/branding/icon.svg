<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="CyberNaiwa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b241b"/>
      <stop offset="0.55" stop-color="#05120d"/>
      <stop offset="1" stop-color="#020705"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="34%" r="62%">
      <stop offset="0" stop-color="#7dffb2" stop-opacity=".18"/>
      <stop offset="0.55" stop-color="#1c8f66" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe36a"/>
