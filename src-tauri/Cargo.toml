[package]
name = "cybernaiwa"
version = "0.1.0"
description = "A cyber ASCII frog that lives on your desktop"
authors = ["CyberNaiwa contributors"]
edition = "2024"

[lib]
name = "cybernaiwa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2.5.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
